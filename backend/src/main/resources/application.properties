
spring.application.name=consultora-rrhh
server.port=8080

# ------------------------------------------------------
# Configuracion de la base de datos
# ------------------------------------------------------
app.db.port=5433
app.db.name=capital_humano

spring.datasource.url=jdbc:postgresql://localhost:${app.db.port}/${app.db.name}
spring.datasource.username=${DB_capital_humano}
spring.datasource.password=${DB_capital_humano_pass}

# ------------------------------------------------------
# Configuracion de Flyway
# ------------------------------------------------------
spring.flyway.enabled=true

# ------------------------------------------------------
# Configuracion de JPA / Hibernate
# ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ------------------------------------------------------
# Configuracion de Jackson
# ------------------------------------------------------
spring.jackson.deserialization.accept-float-as-int=false

# ------------------------------------------------------
# Configuracion de DevTools
# ------------------------------------------------------
spring.devtools.restart.enabled=true

# ------------------------------------------------------
# Configuracion de validaciones
# ------------------------------------------------------
spring.validation.fail-fast=true

# ------------------------------------------------------
# Configuracion de logs
# ------------------------------------------------------
logging.pattern.console=%-5level %logger{36} - %msg%n
logging.exception-conversion-word=%wEx

logging.level.root=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR

# ------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.secret-key=mi-clave-secreta-super-larga-para-pruebas-123456